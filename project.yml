name: Stash
options:
  bundleIdPrefix: app.stash
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  WhiskyKit:
    path: WhiskyKit
  SemanticVersion:
    url: https://github.com/SwiftPackageIndex/SemanticVersion.git
    from: 0.3.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.7"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Stash:
    type: application
    platform: macOS
    sources:
      - path: Stash
    dependencies:
      - package: WhiskyKit
      - package: SemanticVersion
      - target: StashAudio
        link: false
        embed: true
      - target: StashNet
        link: false
        embed: true
    info:
      path: Stash/Info.plist
      properties:
        CFBundleDisplayName: Stash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.games
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "GPL-3.0. Built on Whisky, Wine and Apple's Game Porting Toolkit."
        CFBundleURLTypes:
          - CFBundleURLName: app.stash.Stash
            CFBundleURLSchemes: [stash]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stash.Stash
        PRODUCT_NAME: Stash
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  StashAudio:
    type: library.dynamic
    platform: macOS
    sources:
      - path: StashAudio
    settings:
      base:
        PRODUCT_NAME: StashAudio
        EXECUTABLE_PREFIX: lib
        # Stands in for CoreAudio inside Wine's audio driver, which runs under Rosetta
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
        LD_DYLIB_INSTALL_NAME: "@loader_path/libStashAudio.dylib"
        OTHER_LDFLAGS: -framework CoreAudio -framework CoreFoundation -Wl,-reexport_framework,CoreAudio
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
  StashNet:
    type: library.dynamic
    platform: macOS
    sources:
      - path: StashNet
    settings:
      base:
        # Short name: it replaces the libSystem path in the network driver, which is only 26 characters
        PRODUCT_NAME: sn
        EXECUTABLE_PREFIX: lib
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
        LD_DYLIB_INSTALL_NAME: "@loader_path/libsn.dylib"
        OTHER_LDFLAGS: -Wl,-reexport-lSystem
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
